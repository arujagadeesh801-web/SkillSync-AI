<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Student AI Platform</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Arial, sans-serif;

            background: #ffffff;
            color: #2f3439;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }


        /* =========================
           MAIN CONTAINER
        ========================== */

        .login-container {
            width: 100%;
            max-width: 430px;
        }


        /* =========================
           BRAND
        ========================== */

        .brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand-icon {
            width: 50px;
            height: 50px;

            margin: 0 auto 13px;

            background: #3f4449;
            color: #ffffff;

            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 17px;
            font-weight: 700;

            letter-spacing: 0.5px;
        }

        .brand h1 {
            font-size: 25px;
            font-weight: 700;

            color: #252a2e;

            margin-bottom: 6px;
        }

        .brand p {
            font-size: 14px;
            color: #73787d;
        }


        /* =========================
           LOGIN CARD
        ========================== */

        .login-card {
            background: #e3e3e3;

            border: 1px solid #d2d2d2;

            border-radius: 18px;

            padding: 34px;

            box-shadow:
                0 12px 30px rgba(0, 0, 0, 0.09);
        }

        .login-card h2 {
            font-size: 21px;
            font-weight: 650;

            color: #292d31;

            margin-bottom: 7px;
        }

        .subtitle {
            font-size: 14px;

            color: #70757a;

            margin-bottom: 26px;
        }


        /* =========================
           ERROR MESSAGE
        ========================== */

        .error-message {
            background: #fff5f5;

            border: 1px solid #edcaca;

            color: #b42318;

            border-radius: 9px;

            padding: 11px 12px;

            font-size: 13px;

            margin-bottom: 18px;
        }


        /* =========================
           FORM
        ========================== */

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;

            font-size: 13px;
            font-weight: 600;

            color: #3f4449;

            margin-bottom: 7px;
        }

        .form-group input {
            width: 100%;
            height: 46px;

            padding: 0 14px;

            background: #ffffff;

            border: 1px solid #c7c7c7;

            border-radius: 9px;

            color: #292d31;

            font-size: 14px;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .form-group input:hover {
            border-color: #a9a9a9;
        }

        .form-group input:focus {
            border-color: #6f7478;

            box-shadow:
                0 0 0 3px rgba(90, 90, 90, 0.12);
        }

        .form-group input::placeholder {
            color: #999999;
        }


        /* =========================
           LOGIN BUTTON
        ========================== */

        .login-button {
            width: 100%;
            height: 46px;

            border: none;
            border-radius: 9px;

            background: #3f4449;
            color: #ffffff;

            font-size: 14px;
            font-weight: 700;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.1s ease;
        }

        .login-button:hover {
            background: #303438;
        }

        .login-button:active {
            transform: translateY(1px);
        }


        /* =========================
           REGISTER LINK
        ========================== */

        .register-link {
            text-align: center;

            margin-top: 22px;

            font-size: 14px;

            color: #70757a;
        }

        .register-link a {
            color: #303438;

            font-weight: 600;

            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }


        /* =========================
           FOOTER
        ========================== */

        .footer-note {
            text-align: center;

            margin-top: 20px;

            font-size: 12px;

            color: #9a9a9a;
        }


        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 480px) {

            body {
                padding: 16px;
            }

            .login-card {
                padding: 27px 20px;

                border-radius: 15px;
            }

            .brand h1 {
                font-size: 22px;
            }

            .brand p {
                font-size: 13px;
            }

            .brand-icon {
                width: 46px;
                height: 46px;
            }
        }

    </style>
</head>


<body>

    <div class="login-container">


        <!-- BRAND -->

        <div class="brand">

            <div class="brand-icon">
                SA
            </div>

            <h1>
                Student AI Platform
            </h1>

            <p>
                Your academic performance companion
            </p>

        </div>


        <!-- LOGIN CARD -->

        <div class="login-card">

            <h2>
                Welcome back
            </h2>

            <p class="subtitle">
                Sign in to continue to your student dashboard.
            </p>


            {% if error %}

                <div class="error-message">
                    Unable to sign in. Please check your email and password.
                </div>

            {% endif %}


            <form
                method="POST"
                action="{{ url_for('login') }}"
            >

                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                        autocomplete="email"
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password"
                    >

                </div>


                <!-- BUTTON -->

                <button
                    type="submit"
                    class="login-button"
                >
                    Sign In
                </button>

            </form>


            <!-- REGISTER -->

            <div class="register-link">

                Don't have an account?

                <a href="{{ url_for('register') }}">
                    Create an account
                </a>

            </div>

        </div>


        <!-- FOOTER -->

        <div class="footer-note">
            Student AI Platform · Academic tools for students
        </div>


    </div>

</body>
</html>
